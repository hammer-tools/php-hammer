This inspection checks for senseless usage of <code>array_merge()</code> and suggests simpler alternatives when the call is unnecessary.<br/><br/>

<strong>Example:</strong> <code>array_merge()</code> becomes <code>[]</code>, and <code>array_merge($a)</code> becomes just <code>$a</code>.
