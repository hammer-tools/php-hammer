name: Gradle

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v6.3.0
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Grant execute permissions
        run: chmod +x ./gradlew

      - name: Build plugin
        run: ./gradlew check verifyPlugin buildPlugin
